<!-- NFC symbol — ExpoVia demo asset -->
<!-- Símbolo NFC minimalista con ondas. Sin texto ni marcas existentes. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 96 96"
  width="96"
  height="96"
  fill="none"
  aria-hidden="true"
>
  <!-- Círculo de fondo -->
  <circle cx="48" cy="48" r="44" fill="#1677b8" opacity="0.12"/>
  <circle cx="48" cy="48" r="32" fill="#1677b8" opacity="0.20"/>
  <circle cx="48" cy="48" r="22" fill="#1677b8"/>

  <!-- Símbolo de señal NFC (tres arcos) -->
  <path
    d="M36 38 Q48 26 60 38"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M39.5 43.5 Q48 34 56.5 43.5"
    stroke="white"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Punto central -->
  <circle cx="48" cy="52" r="5" fill="white"/>
</svg>
