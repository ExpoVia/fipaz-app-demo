<!-- Visit success emblem — ExpoVia demo asset -->
<!-- Estrella con pin de ubicación, estilo celebración minimalista.
     Sin texto ni logos. Paleta ExpoVia: amarillo, azul cielo, rosa, violeta. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 96 96"
  width="96"
  height="96"
  fill="none"
  aria-hidden="true"
>
  <!-- Círculo de fondo con gradiente celebración -->
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC21A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8357a5" stop-opacity="0.10"/>
    </radialGradient>
  </defs>
  <circle cx="48" cy="48" r="44" fill="url(#bg-grad)"/>

  <!-- Estrella principal -->
  <polygon
    points="48,14 55,38 80,38 60,54 67,78 48,64 29,78 36,54 16,38 41,38"
    fill="#FFC21A"
    stroke="#f4a2c0"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Pin de ubicación encima de la estrella -->
  <circle cx="48" cy="44" r="9" fill="#1677b8"/>
  <path
    d="M48 53 L43 62 Q48 59 53 62 Z"
    fill="#1677b8"
  />
  <!-- Punto blanco interior del pin -->
  <circle cx="48" cy="43" r="4" fill="white"/>

  <!-- Confeti mínimo: tres puntos de colores -->
  <circle cx="22" cy="24" r="4" fill="#f4a2c0" opacity="0.85"/>
  <circle cx="74" cy="20" r="3" fill="#82b5e3" opacity="0.85"/>
  <circle cx="78" cy="72" r="4" fill="#8357a5" opacity="0.75"/>
  <circle cx="18" cy="70" r="3" fill="#FFC21A" opacity="0.80"/>
</svg>
